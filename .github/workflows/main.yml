name: BIZET OS Tests

on:
  push:
    branches: [main, build-1.1-d-config-first-pilot-r5, build-1.1-d-config-first-pilot-r6, r7-demo-fix, r8-model-first, r10-3-3-3d-interaction-fix-20260926, r10-3-4-single-screen-input-backgrounds-20260926, r10-3-5-isolation-mobile-module-variants-20260926, r10-3-6-auto-render-lifecycle-20260926, r10-3-7-focus-canvas-repaint-20260926, r10-3-8-dedicated-focus-canvas-20260926, r10-3-9-one-screen-selection-20260926, r10-4-0-integrated-module-editor-20260927, r10-4-1-focus-ux-stability-20260927, r10-4-2-offer-approval-bom-20260927, r10-4-3-qa-hard-rules-20260927, r10-4-4-qa-polish-rules-20260927, r10-4-5-module-settings-polish-20260927, r10-4-6-tree-art-grande-v2-20261007]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v
