<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>BIZET OS R10.4.9 — Tree Art Grande</title>
<link rel="stylesheet" href="/static/pilot-shell.css?v=1049">
<link rel="stylesheet" href="/static/grande-r1048.css?v=1049">
</head>
<body class="view-mode">
<header>
  <button id="back" class="icon" aria-label="Назад">←</button>
  <a href="/" class="brand">BIZET <i>OS</i></a>
  <span class="crumb">Tree Art · Grande</span>
  <button id="settingsButton" class="icon" type="button" aria-label="Налаштування" aria-expanded="false">•••</button>
  <div class="mode" aria-label="Режим">
    <button id="viewMode" class="active">VIEW</button>
    <button id="editMode">EDIT</button>
  </div>
  <select id="lang" aria-label="Язык">
    <option value="ru">RU</option><option value="en">EN</option><option value="ua">UA</option>
  </select>
</header>

<main>
  <section class="stageCol">
    <div class="stage" id="stage">
      <div id="webglHost" class="webgl-host"></div>

      <nav id="tools" class="tools" aria-label="Инженерные настройки">
        <button data-panel="room"><b>01</b><span>Помещение</span></button>
        <button data-panel="size"><b>02</b><span>Габариты</span></button>
        <button data-panel="drawers"><b>03</b><span>Ящики</span></button>
        <button data-panel="shelves"><b>04</b><span>Полки</span></button>
        <button data-panel="equipment"><b>05</b><span>Оснащение</span></button>
        <button data-panel="lighting"><b>06</b><span>Освещение</span></button>
        <button data-panel="production"><b>07</b><span>Производство</span></button>
      </nav>

      <div class="hud top">
        <button id="dims" title="Размеры">📏</button>
        <button id="layers" title="Слои">◫</button>
        <button id="xray" title="Прозрачность">◒</button>
        <button id="reset" title="Сбросить камеру">↺</button>
        <button id="isolate" title="Изоляция">◎</button>
      </div>

      <div class="status">
        <strong>Grande</strong>
        <span>Tree Art · WebGL 3D · R10.4.9</span>
      </div>

      <div class="priceHud" id="priceHud">
        <div><span id="priceLabel">Стоимость</span><strong id="priceValue">—</strong></div>
        <select id="currencySelect" aria-label="Валюта">
          <option value="UAH">UAH</option><option value="EUR">EUR</option><option value="USD">USD</option><option value="AUD">AUD</option>
        </select>
      </div>

      <div class="hint" id="hint">Обертання за рухом пальця · pinch — масштаб · утримання виробу — рух уздовж стіни</div>
      <div class="layerPanel" id="layerPanel" hidden></div>

      <button class="add" id="addProduct">＋ Добавить ещё изделие</button>
      <span class="position" id="positionLabel"></span>

      <aside id="panel" class="panel" hidden>
        <button id="panelClose" class="panelClose" aria-label="Закрыть">×</button>
        <small id="panelKicker">TREE ART · GRANDE</small>
        <h2 id="panelTitle"></h2>
        <div id="panelBody"></div>
      </aside>
    </div>
  </section>
</main>

<dialog id="orderDialog" class="orderDialog">
  <div class="orderCard">
    <button id="orderClose" class="panelClose">×</button>
    <small>BIZET · PILOT</small>
    <h2 id="orderTitle">Заказ</h2>
    <div id="orderBody"></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/static/pilot-shell.js?v=1049"></script>
<script src="/static/grande-r1048.js?v=1049"></script>
</body>
</html>
