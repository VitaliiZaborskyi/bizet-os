<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f4f1" />
  <title>BIZET OS — Guided Pilot</title>
  <link rel="stylesheet" href="/static/start.css" />
  <link rel="stylesheet" href="/static/guided.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar compact-topbar">
      <button class="icon-button" id="backButton" type="button" aria-label="Назад">←</button>
      <a class="brand" href="/">BIZET <span>OS</span></a>
      <button class="icon-button" id="settingsButton" type="button" aria-label="Меню">•••</button>
    </header>

    <main class="guided-screen">
      <section class="guided-head">
        <h1 id="title">Выберите</h1>
        <p id="subtitle"></p>
      </section>
      <section class="guided-cards" id="cards"></section>
      <section class="guided-input" id="inputStage" hidden></section>
      <section class="guided-summary" id="summaryStage" hidden></section>
      <p class="guided-error" id="errorNode" hidden></p>
    </main>
  </div>
  <script src="/static/guided.js"></script>
</body>
</html>
