<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIZET OS 10.6.3 · 3D CORE QA</title>
<style>
html,body{margin:0;padding:0;background:#222;color:#fff;font-family:Arial,sans-serif}
#modelStage{position:relative;width:min(94vw,1120px);height:min(82vh,740px);margin:20px auto;overflow:hidden;border:2px solid #777;background:#35393c}
#modelCanvas,#focusCanvas{position:absolute;width:100%;height:100%;inset:0}
#qaStatus{padding:10px 15px;color:#fff}
</style></head><body>
<div id="qaStatus">BIZET OS 10.6.3 · protected 3D browser test</div>
<div id="modelStage"><canvas id="modelCanvas"></canvas><canvas id="focusCanvas"></canvas></div>
<script>
window.BIZET_KITCHEN_UI_MODE='EDIT';
window.BizetModelRuntime={
 getVisual:()=>({}),getInputs:()=>({lighting_enabled:'NO',worktop_thickness_mm:38,
 lower_wall_gap_mm:45,plinth_height_mm:100,lower_depth_mm:515})
};
window.BizetR1063QA={status:'BOOTING',messages:[]};
window.addEventListener('error',e=>window.BizetR1063QA.messages.push('ERROR '+e.message));
window.addEventListener('unhandledrejection',e=>window.BizetR1063QA.messages.push('REJECTION '+e.reason));
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/static/pilot-3d.js?v=106300"></script>
<script src="/static/kitchen-webgl-r1050.js?v=106300"></script>
<script src="/static/r1063-led-model.js?v=106301"></script>
<script src="/static/r1063-visual-adapter.js?v=106301"></script>
<script>
(()=>{
 const qa=window.BizetR1063QA,room={lengthMm:6000,depthMm:4200,heightMm:2800};
 const mods=[
  {id:'QA1',number:1,kind:'HINGED',level:'lower',wall:'A',x:500,y:3635,z:100,w:600,d:515,h:720,
   facade_count:2,facade_openings:['LEFT','RIGHT'],shelf_count:1},
  {id:'QA2',number:2,kind:'DRAWERS',level:'lower',wall:'A',x:1100,y:3635,z:100,w:600,d:515,h:720,
   drawer_count:3,facade_count:3}
 ];
 const options={room,modules:mods,configuration:'WALL_CENTER',activeWalls:['A'],
  focusMode:false,showDimensions:false,showNumbers:false};
 qa.modules=mods;qa.options=options;
 qa.draw=(mode='EDIT')=>{
  if(!window.BizetKitchenWebGL)throw Error('WebGL adapter not initialized');
  window.BIZET_KITCHEN_UI_MODE=mode;
  const opts={...options,focusMode:mode==='ISOLATION',
    modules:mode==='ISOLATION'?[mods[0]]:mods};
  const target=document.getElementById(mode==='ISOLATION'?'focusCanvas':'modelCanvas');
  window.BizetPilot3D.drawKitchenScene(target,opts);
  window.BizetVisualR1063?.refresh?.();
  qa.status='READY';qa.mode=mode;qa.optionsCurrent=opts;return true;
 };
 try{qa.draw('EDIT');document.getElementById('qaStatus').textContent='3D core fixture ready';}
 catch(e){qa.status='FAILED';qa.messages.push('BOOT '+e.stack);}
})();
</script>
</body></html>
