<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f4f1" />
  <title>BIZET OS — Start Experience</title>
  <link rel="stylesheet" href="/static/start.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button back-button" id="backButton" type="button" aria-label="Назад" hidden>
        <span aria-hidden="true">←</span>
      </button>
      <a class="brand" href="/" aria-label="BIZET OS">BIZET <span>OS</span></a>
      <div class="settings-wrap">
        <button class="icon-button menu-button" id="settingsButton" type="button" aria-label="Настройки" aria-expanded="false">
          <span aria-hidden="true">•••</span>
        </button>
        <div class="settings-panel" id="settingsPanel" hidden>
          <div class="settings-title" id="settingsTitle">Настройки</div>

          <label class="settings-field">
            <span id="themeLabel">Тема</span>
            <select id="themeSelect">
              <option value="light">Светлая</option>
              <option value="dark">Тёмная</option>
            </select>
          </label>

          <label class="settings-field">
            <span id="languageLabel">Язык</span>
            <select id="languageSelect">
              <option value="ru">Русский</option>
              <option value="en">English</option>
            </select>
          </label>

          <div class="account-actions">
            <button class="account-button" id="loginButton" type="button">Войти</button>
            <button class="account-button primary-account" id="registerButton" type="button">Регистрация</button>
          </div>
          <p class="settings-notice" id="settingsNotice" hidden></p>
        </div>
      </div>
    </header>

    <main class="experience" id="experience" aria-live="polite">
      <section class="intro" id="introBlock">
        <div class="step-meta" id="stepMeta">Шаг 1 из 4</div>
        <div class="progress" id="progress" aria-label="Прогресс"></div>
        <h1 id="stepTitle">Загрузка проекта…</h1>
        <p id="stepSubtitle">BIZET OS подготавливает стартовый маршрут.</p>
      </section>

      <section class="choice-grid" id="choiceGrid" aria-label="Варианты выбора"></section>

      <section class="summary-card" id="summaryCard" hidden>
        <div class="summary-mark" aria-hidden="true">✓</div>
        <p class="summary-eyebrow" id="summaryEyebrow">Основа проекта готова</p>
        <h1 id="summaryTitle">Можно переходить к помещению</h1>
        <div class="summary-values" id="summaryValues"></div>
        <button class="primary-button" id="continueButton" type="button">Перейти к помещению</button>
        <p class="handoff-note" id="handoffNote">Следующий слой BIZET OS — геометрия помещения.</p>
      </section>

      <div class="error-banner" id="errorBanner" role="alert" hidden></div>
    </main>

    <footer class="footer">
      <span>BIZET OS</span>
      <a href="/legacy" id="legacyLink">Технический стенд</a>
    </footer>
  </div>

  <script type="module" src="/static/start.js"></script>
</body>
</html>
